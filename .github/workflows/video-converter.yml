name: Convert 9x16 Videos to 16x9

on:
  workflow_dispatch:

# ==============================================================
# IMPORTANT
# Allows GitHub Actions to update processed_videos.txt
# ==============================================================

permissions:
  contents: write


jobs:
  convert:

    runs-on: ubuntu-latest

    env:

      # ----------------------------------------------------------
      # Google Drive source
      # ----------------------------------------------------------

      SOURCE_DIR: "NanNanDrive:NanNanIphone"

      # ----------------------------------------------------------
      # Google Drive destination
      # ----------------------------------------------------------

      DEST_DIR: "NanNanDrive:NanNanIphone2"

      # ----------------------------------------------------------
      # Maximum videos per workflow run
      # ----------------------------------------------------------

      MAX_VIDEOS: "10"

      # ----------------------------------------------------------
      # GitHub record file
      # ----------------------------------------------------------

      RECORD_FILE: "processed_videos.txt"


    steps:

      # ==========================================================
      # 1. Checkout repository
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      # ==========================================================
      # 2. Install rclone
      # ==========================================================

      - name: Install rclone
        shell: bash
        run: |

          echo "=========================================="
          echo "Installing rclone"
          echo "=========================================="

          curl https://rclone.org/install.sh | sudo bash

          rclone version


      # ==========================================================
      # 3. Install FFmpeg
      # ==========================================================

      - name: Install FFmpeg
        shell: bash
        run: |

          echo "=========================================="
          echo "Installing FFmpeg"
          echo "=========================================="

          sudo apt-get update

          sudo apt-get install -y ffmpeg

          ffmpeg -version


      # ==========================================================
      # 4. Restore rclone config
      # ==========================================================

      - name: Restore rclone config
        shell: bash

        env:

          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}

        run: |

          echo "Restoring rclone configuration..."

          mkdir -p "$HOME/.config/rclone"

          printf '%s' "$RCLONE_CONFIG_DATA" \
            > "$HOME/.config/rclone/rclone.conf"

          chmod 600 \
            "$HOME/.config/rclone/rclone.conf"

          echo "rclone config restored."


      # ==========================================================
      # 5. Test Google Drive
      # ==========================================================

      - name: Test Google Drive
        shell: bash
        run: |

          echo "=========================================="
          echo "Testing Google Drive"
          echo "=========================================="

          rclone lsd "NanNanDrive:"

          echo ""

          echo "Google Drive connection OK."


      # ==========================================================
      # 6. Make sure record file exists
      # ==========================================================

      - name: Prepare processed record
        shell: bash
        run: |

          echo "=========================================="
          echo "Preparing processed record"
          echo "=========================================="

          if [ ! -f "$RECORD_FILE" ]; then

            echo "Record file does not exist."

            echo "Creating:"
            echo "$RECORD_FILE"

            touch "$RECORD_FILE"

          fi


          echo ""

          echo "Already processed videos:"

          if [ -s "$RECORD_FILE" ]; then

            nl -ba "$RECORD_FILE"

          else

            echo "No processed videos recorded yet."

          fi


      # ==========================================================
      # 7. Create temporary folders
      # ==========================================================

      - name: Create working folders
        shell: bash
        run: |

          rm -rf input
          rm -rf output

          mkdir -p input
          mkdir -p output


      # ==========================================================
      # 8. Get videos from NanNanIphone
      #
      # IMPORTANT:
      #
      # rclone itself does NOT use --sort.
      #
      # Linux sort is used.
      #
      # Therefore the order is deterministic.
      # NO RANDOM.
      # ==========================================================

      - name: Get source videos
        shell: bash
        run: |

          echo "=========================================="
          echo "Getting source videos"
          echo "=========================================="

          rclone lsf \
            "$SOURCE_DIR" \
            --files-only \
            --recursive \
            --format "p" \
            > all_videos_raw.txt


          # ------------------------------------------------------
          # Alphabetical sorting
          # ------------------------------------------------------

          sort -f all_videos_raw.txt \
            > all_videos.txt


          echo ""

          echo "All source videos:"

          if [ -s all_videos.txt ]; then

            nl -ba all_videos.txt

          else

            echo "No videos found."

          fi


      # ==========================================================
      # 9. Build pending queue
      #
      # ONLY videos NOT inside processed_videos.txt
      # ==========================================================

      - name: Build pending queue
        shell: bash
        run: |

          echo "=========================================="
          echo "BUILDING PENDING VIDEO QUEUE"
          echo "=========================================="


          rm -f pending_videos.txt

          touch pending_videos.txt


          while IFS= read -r relative_path
          do

            # ----------------------------------------------------
            # Ignore empty lines
            # ----------------------------------------------------

            if [ -z "$relative_path" ]; then
              continue
            fi


            # ----------------------------------------------------
            # Only supported video formats
            # ----------------------------------------------------

            case "$relative_path" in

              *.mp4|*.MP4|*.mov|*.MOV|*.mkv|*.MKV|*.webm|*.WEBM|*.avi|*.AVI)
                ;;

              *)
                echo "Not a supported video:"
                echo "$relative_path"
                echo "SKIP"
                continue
                ;;

            esac


            # ----------------------------------------------------
            # Check GitHub record
            #
            # EXACT MATCH
            # ----------------------------------------------------

            if grep -Fqx \
              "$relative_path" \
              "$RECORD_FILE"
            then

              echo ""
              echo "ALREADY PROCESSED:"
              echo "$relative_path"
              echo "ACTION: SKIP"

            else

              echo ""
              echo "NOT PROCESSED:"
              echo "$relative_path"
              echo "ACTION: ADD TO QUEUE"

              printf '%s\n' "$relative_path" \
                >> pending_videos.txt

            fi

          done < all_videos.txt


          # ------------------------------------------------------
          # Remove duplicates
          # ------------------------------------------------------

          sort -fu pending_videos.txt \
            -o pending_videos.txt


          echo ""

          echo "=========================================="
          echo "PENDING VIDEOS"
          echo "=========================================="


          if [ -s pending_videos.txt ]; then

            nl -ba pending_videos.txt

          else

            echo "No new videos."

          fi


      # ==========================================================
      # 10. Select maximum 10 videos
      #
      # NEVER RANDOM
      # ==========================================================

      - name: Select maximum 10 videos
        shell: bash
        run: |

          head -n "$MAX_VIDEOS" pending_videos.txt \
            > selected_videos.txt


          echo "=========================================="
          echo "VIDEOS FOR THIS RUN"
          echo "=========================================="


          if [ -s selected_videos.txt ]; then

            nl -ba selected_videos.txt

          else

            echo "Nothing to process."

          fi


          echo ""

          echo "Selected count:"

          wc -l selected_videos.txt


      # ==========================================================
      # 11. Convert selected videos
      # ==========================================================

      - name: Convert and upload selected videos
        shell: bash
        run: |

          total=$(wc -l < selected_videos.txt)

          current=0

          success=0

          failed=0


          echo ""

          echo "=================================================="
          echo "START PROCESSING"
          echo "TOTAL SELECTED: $total"
          echo "=================================================="


          # ========================================================
          # LOOP THROUGH ALL SELECTED VIDEOS
          # ========================================================

          while IFS= read -r relative_path
          do

            if [ -z "$relative_path" ]; then
              continue
            fi


            current=$((current + 1))


            echo ""
            echo ""
            echo "##################################################"
            echo "# VIDEO $current / $total"
            echo "# $relative_path"
            echo "##################################################"


            # ======================================================
            # SAFETY CHECK
            #
            # Check GitHub record AGAIN before processing.
            #
            # This prevents accidental duplicate processing.
            # ======================================================

            if grep -Fqx \
              "$relative_path" \
              "$RECORD_FILE"
            then

              echo ""
              echo "Already in processed_videos.txt"
              echo "SKIPPING:"
              echo "$relative_path"

              continue

            fi


            # ======================================================
            # Local file paths
            # ======================================================

            input_file="input/$relative_path"

            output_file="output/$relative_path"


            mkdir -p \
              "$(dirname "$input_file")"

            mkdir -p \
              "$(dirname "$output_file")"


            # ======================================================
            # DOWNLOAD
            # ======================================================

            echo ""
            echo "[$current/$total] Downloading..."

            if ! rclone copyto \
              "$SOURCE_DIR/$relative_path" \
              "$input_file" \
              --progress
            then

              echo ""
              echo "DOWNLOAD FAILED:"
              echo "$relative_path"

              failed=$((failed + 1))

              continue

            fi


            # ======================================================
            # Verify downloaded file
            # ======================================================

            if [ ! -f "$input_file" ]; then

              echo ""
              echo "ERROR:"
              echo "Downloaded file not found."

              failed=$((failed + 1))

              continue

            fi


            echo ""
            echo "Download successful:"

            ls -lh "$input_file"


            # ======================================================
            # FFmpeg
            #
            # 9:16 -> 16:9
            #
            # Output:
            # 1920x1080
            #
            # Background:
            # enlarged + crop + blur
            #
            # Foreground:
            # original vertical video centered
            # ======================================================

            echo ""
            echo "[$current/$total] Converting..."

            if ! ffmpeg \
              -y \
              -i "$input_file" \
              -filter_complex "

                [0:v]
                scale=1920:1080:force_original_aspect_ratio=increase,
                crop=1920:1080,
                gblur=sigma=35,
                setsar=1
                [bg];

                [0:v]
                scale=608:1080:force_original_aspect_ratio=decrease,
                setsar=1
                [fg];

                [bg][fg]
                overlay=(W-w)/2:(H-h)/2,
                format=yuv420p
                [video]

              " \
              -map "[video]" \
              -map 0:a? \
              -c:v libx264 \
              -preset medium \
              -crf 20 \
              -pix_fmt yuv420p \
              -c:a aac \
              -b:a 192k \
              -movflags +faststart \
              "$output_file"
            then

              echo ""
              echo "FFmpeg FAILED:"
              echo "$relative_path"

              failed=$((failed + 1))

              rm -f "$input_file"
              rm -f "$output_file"

              continue

            fi


            # ======================================================
            # Check output
            # ======================================================

            if [ ! -f "$output_file" ]; then

              echo ""
              echo "ERROR:"
              echo "Output file was not created."

              failed=$((failed + 1))

              rm -f "$input_file"

              continue

            fi


            echo ""
            echo "Conversion successful:"

            ls -lh "$output_file"


            # ======================================================
            # Verify resolution
            # ======================================================

            resolution=$(ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=width,height \
              -of csv=s=x:p=0 \
              "$output_file")


            echo ""
            echo "Output resolution:"
            echo "$resolution"


            if [ "$resolution" != "1920x1080" ]; then

              echo ""
              echo "ERROR:"
              echo "Output is NOT 1920x1080."

              failed=$((failed + 1))

              rm -f "$input_file"
              rm -f "$output_file"

              continue

            fi


            # ======================================================
            # UPLOAD TO GOOGLE DRIVE
            # ======================================================

            destination="$DEST_DIR/$relative_path"


            echo ""
            echo "[$current/$total] Uploading..."

            if ! rclone copyto \
              "$output_file" \
              "$destination" \
              --progress
            then

              echo ""
              echo "UPLOAD FAILED:"
              echo "$relative_path"

              failed=$((failed + 1))

              rm -f "$input_file"
              rm -f "$output_file"

              continue

            fi


            # ======================================================
            # VERIFY GOOGLE DRIVE UPLOAD
            # ======================================================

            echo ""
            echo "Verifying uploaded file..."


            uploaded_name=$(basename "$relative_path")


            if rclone lsf \
              "$destination" \
              --files-only \
              --max-depth 1 \
              2>/dev/null \
              | grep -Fxq "$uploaded_name"
            then

              echo ""
              echo "=========================================="
              echo "UPLOAD SUCCESS"
              echo "$relative_path"
              echo "=========================================="


              success=$((success + 1))


              # ==================================================
              # IMPORTANT
              #
              # ONLY AFTER SUCCESSFUL UPLOAD
              # add video to processed_videos.txt
              # ==================================================

              echo "$relative_path" \
                >> "$RECORD_FILE"


              # --------------------------------------------------
              # Remove duplicates and sort record
              # --------------------------------------------------

              sort -fu "$RECORD_FILE" \
                -o "$RECORD_FILE"


              echo ""
              echo "Added to processed record:"
              echo "$relative_path"


              # --------------------------------------------------
              # Delete temporary files
              # --------------------------------------------------

              rm -f "$input_file"
              rm -f "$output_file"


            else

              echo ""
              echo "UPLOAD VERIFICATION FAILED:"
              echo "$relative_path"


              failed=$((failed + 1))


              # IMPORTANT:
              #
              # Do NOT add to processed_videos.txt
              #
              # So it can be retried next run.

              rm -f "$input_file"
              rm -f "$output_file"


              continue

            fi


          done < selected_videos.txt


          # ========================================================
          # FINAL SUMMARY
          # ========================================================

          echo ""
          echo ""
          echo "=================================================="
          echo "FINAL SUMMARY"
          echo "=================================================="

          echo "Selected : $total"
          echo "Success  : $success"
          echo "Failed   : $failed"
          echo "Maximum  : $MAX_VIDEOS"

          echo "=================================================="


          echo ""
          echo "Processed record currently contains:"

          nl -ba "$RECORD_FILE"


      # ==========================================================
      # 12. Commit processed record to GitHub
      #
      # IMPORTANT:
      #
      # Only processed_videos.txt is committed.
      # Videos are NOT uploaded to GitHub.
      # ==========================================================

      - name: Save processed record to GitHub
        shell: bash
        run: |

          echo "=========================================="
          echo "SAVING PROCESSED RECORD"
          echo "=========================================="


          # ------------------------------------------------------
          # Git configuration
          # ------------------------------------------------------

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          # ------------------------------------------------------
          # Add ONLY record file
          # ------------------------------------------------------

          git add "$RECORD_FILE"


          # ------------------------------------------------------
          # Check whether anything changed
          # ------------------------------------------------------

          if git diff --cached --quiet; then

            echo ""
            echo "No record changes to commit."

          else

            echo ""
            echo "Changes detected."

            git commit \
              -m "Update processed video record"


            echo ""
            echo "Pushing record to GitHub..."

            git push

            echo ""
            echo "Record successfully saved to GitHub."

          fi


      # ==========================================================
      # 13. Final record display
      # ==========================================================

      - name: Final processed record
        shell: bash
        run: |

          echo ""
          echo "=================================================="
          echo "FINAL PROCESSED VIDEO RECORD"
          echo "=================================================="


          if [ -s "$RECORD_FILE" ]; then

            nl -ba "$RECORD_FILE"

          else

            echo "No processed videos."

          fi


          echo ""
          echo "=================================================="
          echo "WORKFLOW FINISHED"
          echo "=================================================="
