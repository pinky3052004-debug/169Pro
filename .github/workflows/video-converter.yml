name: Convert 9x16 Videos to 16x9

on:
  workflow_dispatch:

# Prevent two workflow runs from processing the same videos
# at the same time.
concurrency:
  group: video-conversion
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    env:
      SOURCE_DIR: "NanNanDrive:NanNanIphone"
      DEST_DIR: "NanNanDrive:NanNanIphone2"
      MAX_VIDEOS: "100"
      RECORD_FILE: "processed_videos.txt"

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # 2. INSTALL RCLONE
      # ============================================================
      - name: Install rclone
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "INSTALLING RCLONE"
          echo "=========================================="

          curl https://rclone.org/install.sh | sudo bash

          echo ""
          rclone version


      # ============================================================
      # 3. INSTALL FFMPEG
      # ============================================================
      - name: Install FFmpeg
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "INSTALLING FFMPEG"
          echo "=========================================="

          sudo apt-get update
          sudo apt-get install -y ffmpeg

          echo ""
          ffmpeg -version


      # ============================================================
      # 4. RESTORE RCLONE CONFIG
      # ============================================================
      - name: Restore rclone config
        shell: bash
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          set -e

          echo "=========================================="
          echo "RESTORING RCLONE CONFIG"
          echo "=========================================="

          mkdir -p "$HOME/.config/rclone"

          printf '%s' "$RCLONE_CONFIG_DATA" \
            > "$HOME/.config/rclone/rclone.conf"

          chmod 600 "$HOME/.config/rclone/rclone.conf"

          echo "rclone config restored."


      # ============================================================
      # 5. TEST GOOGLE DRIVE CONNECTION
      # ============================================================
      - name: Test Google Drive
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "TESTING GOOGLE DRIVE"
          echo "=========================================="

          rclone lsd "NanNanDrive:"

          echo ""
          echo "Google Drive connection OK."


      # ============================================================
      # 6. PREPARE PROCESSED RECORD
      # ============================================================
      - name: Prepare processed record
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "PREPARING PROCESSED RECORD"
          echo "=========================================="

          if [ ! -f "$RECORD_FILE" ]; then
            touch "$RECORD_FILE"
          fi

          echo ""
          echo "Already processed videos:"

          if [ -s "$RECORD_FILE" ]; then
            nl -ba "$RECORD_FILE"
          else
            echo "No processed videos recorded yet."
          fi


      # ============================================================
      # 7. CREATE WORKING FOLDERS
      # ============================================================
      - name: Create working folders
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CREATING WORKING FOLDERS"
          echo "=========================================="

          rm -rf input
          rm -rf output

          mkdir -p input
          mkdir -p output

          echo "Working folders ready."


      # ============================================================
      # 8. GET ALL VIDEOS FROM GOOGLE DRIVE
      # ============================================================
      - name: Get source videos
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "GETTING SOURCE VIDEOS"
          echo "=========================================="

          rclone lsf \
            "$SOURCE_DIR" \
            --files-only \
            --recursive \
            --format "p" \
            > all_videos_raw.txt

          # Alphabetical deterministic sorting.
          sort -f all_videos_raw.txt > all_videos.txt

          echo ""
          echo "ALL SOURCE VIDEOS:"
          echo "------------------------------------------"

          if [ -s all_videos.txt ]; then
            nl -ba all_videos.txt
          else
            echo "No videos found."
          fi


      # ============================================================
      # 9. BUILD PENDING QUEUE
      # ============================================================
      - name: Build pending queue
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING PENDING QUEUE"
          echo "=========================================="

          rm -f pending_videos.txt
          touch pending_videos.txt

          while IFS= read -r relative_path
          do

            if [ -z "$relative_path" ]; then
              continue
            fi

            # Supported video extensions
            case "$relative_path" in
              *.mp4|*.MP4|*.mov|*.MOV|*.mkv|*.MKV|*.webm|*.WEBM|*.avi|*.AVI)
                ;;
              *)
                echo "Not a supported video: $relative_path"
                continue
                ;;
            esac

            # Check processed record.
            if grep -Fqx "$relative_path" "$RECORD_FILE"; then

              echo "ALREADY PROCESSED: $relative_path"
              echo "ACTION: SKIP"

            else

              echo "NOT PROCESSED: $relative_path"

              printf '%s\n' "$relative_path" \
                >> pending_videos.txt

            fi

          done < all_videos.txt

          # Remove duplicates and keep deterministic order.
          sort -fu pending_videos.txt \
            -o pending_videos.txt

          echo ""
          echo "PENDING VIDEOS:"
          echo "------------------------------------------"

          if [ -s pending_videos.txt ]; then
            nl -ba pending_videos.txt
          else
            echo "No new videos."
          fi


      # ============================================================
      # 10. SELECT MAXIMUM 10 VIDEOS
      # ============================================================
      - name: Select maximum 10 videos
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SELECTING VIDEOS"
          echo "=========================================="

          head -n "$MAX_VIDEOS" \
            pending_videos.txt \
            > selected_videos.txt

          echo ""
          echo "VIDEOS FOR THIS RUN:"
          echo "------------------------------------------"

          if [ -s selected_videos.txt ]; then
            nl -ba selected_videos.txt
          else
            echo "Nothing to process."
          fi

          echo ""
          echo "Selected count:"
          wc -l selected_videos.txt


      # ============================================================
      # 11. CONVERT AND UPLOAD
      # ============================================================
      - name: Convert and upload selected videos
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "STARTING VIDEO PROCESSING"
          echo "=================================================="

          total=$(wc -l < selected_videos.txt)

          current=0
          success=0
          failed=0

          while IFS= read -r relative_path
          do

            # Ignore empty lines.
            if [ -z "$relative_path" ]; then
              continue
            fi

            current=$((current + 1))

            echo ""
            echo "=================================================="
            echo "PROCESSING VIDEO $current / $total"
            echo "=================================================="
            echo "$relative_path"
            echo "=================================================="


            # --------------------------------------------------------
            # SAFETY CHECK
            # --------------------------------------------------------
            if grep -Fqx "$relative_path" "$RECORD_FILE"; then

              echo "Already in processed_videos.txt."
              echo "Skipping..."

              continue

            fi


            # --------------------------------------------------------
            # FILE PATHS
            # --------------------------------------------------------
            input_file="input/$relative_path"
            output_file="output/$relative_path"

            mkdir -p "$(dirname "$input_file")"
            mkdir -p "$(dirname "$output_file")"


            # --------------------------------------------------------
            # DOWNLOAD
            # --------------------------------------------------------
            echo ""
            echo "=========================================="
            echo "DOWNLOADING"
            echo "=========================================="

            if ! rclone copyto \
              "$SOURCE_DIR/$relative_path" \
              "$input_file" \
              --progress
            then

              echo ""
              echo "DOWNLOAD FAILED:"
              echo "$relative_path"

              failed=$((failed + 1))

              continue

            fi


            # --------------------------------------------------------
            # CHECK DOWNLOADED FILE
            # --------------------------------------------------------
            if [ ! -f "$input_file" ]; then

              echo ""
              echo "Downloaded file was not found:"
              echo "$input_file"

              failed=$((failed + 1))

              continue

            fi

            echo ""
            echo "Download successful:"
            ls -lh "$input_file"


            # --------------------------------------------------------
            # FFMPEG CONVERSION
            #
            # IMPORTANT:
            # -nostdin prevents FFmpeg from reading the
            # selected_videos.txt input stream.
            #
            # This fixes the problem where only 1 video
            # was processed out of 10 selected videos.
            # --------------------------------------------------------
            echo ""
            echo "=========================================="
            echo "CONVERTING TO 1920x1080"
            echo "=========================================="

            if ! ffmpeg \
              -nostdin \
              -y \
              -i "$input_file" \
              -filter_complex "
                [0:v]
                scale=1920:1080:force_original_aspect_ratio=increase,
                crop=1920:1080,
                gblur=sigma=35,
                setsar=1
                [bg];

                [0:v]
                scale=608:1080:force_original_aspect_ratio=decrease,
                setsar=1
                [fg];

                [bg][fg]
                overlay=(W-w)/2:(H-h)/2,
                format=yuv420p
                [video]
              " \
              -map "[video]" \
              -map 0:a? \
              -c:v libx264 \
              -preset medium \
              -crf 20 \
              -pix_fmt yuv420p \
              -c:a aac \
              -b:a 192k \
              -movflags +faststart \
              "$output_file"
            then

              echo ""
              echo "FFmpeg conversion FAILED:"
              echo "$relative_path"

              failed=$((failed + 1))

              rm -f "$input_file"
              rm -f "$output_file"

              continue

            fi


            # --------------------------------------------------------
            # CHECK OUTPUT FILE
            # --------------------------------------------------------
            if [ ! -f "$output_file" ]; then

              echo ""
              echo "Output file was not created."

              failed=$((failed + 1))

              rm -f "$input_file"
              rm -f "$output_file"

              continue

            fi

            echo ""
            echo "Conversion successful:"
            ls -lh "$output_file"


            # --------------------------------------------------------
            # VERIFY RESOLUTION
            # --------------------------------------------------------
            echo ""
            echo "=========================================="
            echo "VERIFYING OUTPUT RESOLUTION"
            echo "=========================================="

            resolution=$(ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=width,height \
              -of csv=s=x:p=0 \
              "$output_file")

            echo ""
            echo "Output resolution:"
            echo "$resolution"


            if [ "$resolution" != "1920x1080" ]; then

              echo ""
              echo "WRONG OUTPUT RESOLUTION"
              echo "Expected: 1920x1080"
              echo "Actual:   $resolution"

              failed=$((failed + 1))

              rm -f "$input_file"
              rm -f "$output_file"

              continue

            fi


            # --------------------------------------------------------
            # UPLOAD TO GOOGLE DRIVE
            # --------------------------------------------------------
            destination="$DEST_DIR/$relative_path"

            echo ""
            echo "=========================================="
            echo "UPLOADING"
            echo "=========================================="

            echo "Source:"
            echo "$output_file"

            echo ""
            echo "Destination:"
            echo "$destination"

            if ! rclone copyto \
              "$output_file" \
              "$destination" \
              --progress
            then

              echo ""
              echo "UPLOAD FAILED:"
              echo "$relative_path"

              failed=$((failed + 1))

              rm -f "$input_file"
              rm -f "$output_file"

              continue

            fi


            # --------------------------------------------------------
            # VERIFY UPLOAD
            # --------------------------------------------------------
            echo ""
            echo "=========================================="
            echo "VERIFYING UPLOADED FILE"
            echo "=========================================="

            uploaded_name=$(basename "$relative_path")

            if rclone lsf \
              "$destination" \
              --files-only \
              --max-depth 1 \
              2>/dev/null \
              | grep -Fxq "$uploaded_name"
            then

              echo ""
              echo "=========================================="
              echo "UPLOAD SUCCESS"
              echo "=========================================="

              echo "$relative_path"

              echo ""
              echo "=========================================="
              echo "ADDING TO PROCESSED RECORD"
              echo "=========================================="

              echo "$relative_path" \
                >> "$RECORD_FILE"

              # Keep record unique and sorted.
              sort -fu "$RECORD_FILE" \
                -o "$RECORD_FILE"

              echo ""
              echo "Added to processed record:"
              echo "$relative_path"

              success=$((success + 1))


              # ------------------------------------------------------
              # CLEAN TEMP FILES ONLY AFTER SUCCESS
              # ------------------------------------------------------
              rm -f "$input_file"
              rm -f "$output_file"

            else

              echo ""
              echo "=========================================="
              echo "UPLOAD VERIFICATION FAILED"
              echo "=========================================="

              echo "$relative_path"

              echo ""
              echo "This video will NOT be added to processed_videos.txt."

              failed=$((failed + 1))

              rm -f "$input_file"
              rm -f "$output_file"

              continue

            fi

          done < selected_videos.txt


          # ==========================================================
          # FINAL SUMMARY
          # ==========================================================
          echo ""
          echo "=================================================="
          echo "FINAL SUMMARY"
          echo "=================================================="

          echo "Selected : $total"
          echo "Success  : $success"
          echo "Failed   : $failed"
          echo "Maximum  : $MAX_VIDEOS"

          echo ""
          echo "=================================================="
          echo "PROCESSED RECORD CURRENTLY CONTAINS:"
          echo "=================================================="

          if [ -s "$RECORD_FILE" ]; then
            nl -ba "$RECORD_FILE"
          else
            echo "No processed videos."
          fi

          echo "=================================================="


      # ============================================================
      # 12. SAVE PROCESSED RECORD TO GITHUB
      # ============================================================
      - name: Save processed record to GitHub
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SAVING PROCESSED RECORD"
          echo "=========================================="

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          # Only add the record file.
          git add "$RECORD_FILE"


          if git diff --cached --quiet; then

            echo ""
            echo "No record changes to commit."

          else

            echo ""
            echo "Changes detected."

            git commit \
              -m "Update processed video record"

            echo ""
            echo "Pushing record to GitHub..."

            git push

            echo ""
            echo "Record successfully saved to GitHub."

          fi


      # ============================================================
      # 13. FINAL RECORD
      # ============================================================
      - name: Final processed record
        shell: bash
        run: |
          echo ""
          echo "=================================================="
          echo "FINAL PROCESSED VIDEO RECORD"
          echo "=================================================="

          if [ -s "$RECORD_FILE" ]; then
            nl -ba "$RECORD_FILE"
          else
            echo "No processed videos."
          fi

          echo "=================================================="
          echo "WORKFLOW FINISHED"
          echo "=================================================="
