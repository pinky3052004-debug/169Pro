name: Convert 9x16 Videos to 16x9

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    env:
      SOURCE_DIR: "NanNanDrive:NanNanIphone"
      DEST_DIR: "NanNanDrive:NanNanIphone2"
      MAX_VIDEOS: "10"

    steps:

      # ============================================================
      # 1. Install rclone
      # ============================================================
      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash
          rclone version


      # ============================================================
      # 2. Install FFmpeg
      # ============================================================
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version


      # ============================================================
      # 3. Restore rclone.conf from GitHub Secret
      # ============================================================
      - name: Restore rclone config
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p "$HOME/.config/rclone"

          printf '%s' "$RCLONE_CONFIG_DATA" \
            > "$HOME/.config/rclone/rclone.conf"

          chmod 600 "$HOME/.config/rclone/rclone.conf"

          echo "rclone config restored."


      # ============================================================
      # 4. Test Google Drive
      # ============================================================
      - name: Test Google Drive
        run: |
          echo "Testing Google Drive..."

          rclone lsd "NanNanDrive:" || {
            echo "ERROR: Cannot connect to Google Drive."
            exit 1
          }

          echo "Google Drive connection OK."


      # ============================================================
      # 5. Create working directories
      # ============================================================
      - name: Create working directories
        run: |
          rm -rf input
          rm -rf output

          mkdir -p input
          mkdir -p output

          echo "Working directories created."


      # ============================================================
      # 6. Get ALL videos from NanNanIphone
      #
      # IMPORTANT:
      # No rclone --sort here.
      #
      # We use Linux sort instead.
      #
      # This makes the order deterministic.
      # NOT RANDOM.
      # ============================================================
      - name: Build deterministic video list
        shell: bash
        run: |

          echo "=========================================="
          echo "Reading videos from NanNanIphone"
          echo "=========================================="

          rclone lsf \
            "$SOURCE_DIR" \
            --files-only \
            --recursive \
            --format "p" \
            > all_videos_raw.txt

          echo ""
          echo "Sorting videos alphabetically..."

          sort -f all_videos_raw.txt > all_videos.txt

          echo ""
          echo "All videos:"
          cat all_videos.txt || true


      # ============================================================
      # 7. Find videos that have NOT been converted yet
      #
      # Destination:
      # NanNanIphone2
      #
      # If same relative path exists there:
      # SKIP
      #
      # Otherwise:
      # PENDING
      # ============================================================
      - name: Find unprocessed videos
        shell: bash
        run: |

          echo "=========================================="
          echo "Checking already converted videos"
          echo "=========================================="

          rm -f pending_videos.txt

          touch pending_videos.txt

          while IFS= read -r relative_path
          do

            # Ignore empty lines
            if [ -z "$relative_path" ]; then
              continue
            fi

            # Check extension
            case "$relative_path" in

              *.mp4|*.MP4|*.mov|*.MOV|*.mkv|*.MKV|*.webm|*.WEBM|*.avi|*.AVI)
                ;;

              *)
                echo "SKIP - Not a supported video: $relative_path"
                continue
                ;;

            esac

            destination_file="$DEST_DIR/$relative_path"

            echo ""
            echo "Checking:"
            echo "$relative_path"

            # ----------------------------------------------------
            # Check exact destination file
            # ----------------------------------------------------
            if rclone lsf \
              "$destination_file" \
              --files-only \
              2>/dev/null | grep -q .
            then

              echo "ALREADY CONVERTED -> SKIP"

            else

              echo "NOT CONVERTED -> PENDING"

              printf '%s\n' "$relative_path" >> pending_videos.txt

            fi

          done < all_videos.txt


          echo ""
          echo "=========================================="
          echo "ALL PENDING VIDEOS"
          echo "=========================================="

          cat pending_videos.txt || true


      # ============================================================
      # 8. Select ONLY first 10
      #
      # NOT RANDOM
      #
      # Because pending_videos.txt is already sorted.
      # ============================================================
      - name: Select first 10 videos
        shell: bash
        run: |

          head -n "$MAX_VIDEOS" pending_videos.txt \
            > selected_videos.txt

          echo "=========================================="
          echo "VIDEOS SELECTED FOR THIS RUN"
          echo "=========================================="

          if [ -s selected_videos.txt ]; then
            cat selected_videos.txt
          else
            echo "No new videos to process."
          fi


          echo ""
          echo "Number selected:"
          wc -l selected_videos.txt


      # ============================================================
      # 9. Process videos
      # ============================================================
      - name: Convert and upload videos
        shell: bash
        run: |

          processed=0
          failed=0

          while IFS= read -r relative_path
          do

            if [ -z "$relative_path" ]; then
              continue
            fi

            processed=$((processed + 1))

            echo ""
            echo "=========================================="
            echo "PROCESSING $processed / $MAX_VIDEOS"
            echo "=========================================="

            echo "Video:"
            echo "$relative_path"

            # ----------------------------------------------------
            # Local paths
            # ----------------------------------------------------

            input_file="input/$relative_path"
            output_file="output/$relative_path"

            input_directory="$(dirname "$input_file")"
            output_directory="$(dirname "$output_file")"

            mkdir -p "$input_directory"
            mkdir -p "$output_directory"


            # ----------------------------------------------------
            # Download source video
            # ----------------------------------------------------

            echo ""
            echo "Downloading from Google Drive..."

            if ! rclone copyto \
              "$SOURCE_DIR/$relative_path" \
              "$input_file" \
              --progress
            then

              echo "ERROR: Download failed."
              failed=$((failed + 1))
              continue

            fi


            # ----------------------------------------------------
            # Check downloaded file
            # ----------------------------------------------------

            if [ ! -f "$input_file" ]; then

              echo "ERROR: Downloaded file does not exist."
              failed=$((failed + 1))
              continue

            fi


            echo ""
            echo "Downloaded successfully:"
            ls -lh "$input_file"


            # ----------------------------------------------------
            # Get video information
            # ----------------------------------------------------

            echo ""
            echo "Input video information:"

            ffprobe \
              -v error \
              -show_entries stream=width,height,duration \
              -of default=noprint_wrappers=1 \
              "$input_file" || true


            # ====================================================
            # 10. Convert 9:16 -> 16:9
            #
            # Output:
            # 1920 x 1080
            #
            # Background:
            # - Enlarged
            # - Cropped to 16:9
            # - Strong blur
            #
            # Foreground:
            # - Original video
            # - Scaled to fit vertically
            # - Centered
            # ====================================================

            echo ""
            echo "Converting to 1920x1080..."

            if ! ffmpeg \
              -y \
              -i "$input_file" \
              -filter_complex "

                [0:v]
                scale=1920:1080:force_original_aspect_ratio=increase,
                crop=1920:1080,
                gblur=sigma=35,
                setsar=1
                [background];

                [0:v]
                scale=608:1080:force_original_aspect_ratio=decrease,
                pad=608:1080:(ow-iw)/2:(oh-ih)/2,
                setsar=1
                [foreground];

                [background][foreground]
                overlay=(W-w)/2:(H-h)/2,
                format=yuv420p
                [video]

              " \
              -map "[video]" \
              -map 0:a? \
              -c:v libx264 \
              -preset medium \
              -crf 20 \
              -pix_fmt yuv420p \
              -c:a aac \
              -b:a 192k \
              -movflags +faststart \
              "$output_file"
            then

              echo "ERROR: FFmpeg conversion failed."
              failed=$((failed + 1))
              continue

            fi


            # ----------------------------------------------------
            # Check output
            # ----------------------------------------------------

            if [ ! -f "$output_file" ]; then

              echo "ERROR: Output file was not created."
              failed=$((failed + 1))
              continue

            fi


            echo ""
            echo "Conversion successful:"
            ls -lh "$output_file"


            # ----------------------------------------------------
            # Verify output resolution
            # ----------------------------------------------------

            echo ""
            echo "Checking output resolution..."

            resolution=$(ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=width,height \
              -of csv=s=x:p=0 \
              "$output_file")

            echo "Output resolution: $resolution"

            if [ "$resolution" != "1920x1080" ]; then

              echo "ERROR: Output is not 1920x1080."
              failed=$((failed + 1))
              continue

            fi


            # ====================================================
            # 11. Upload to NanNanIphone2
            # ====================================================

            echo ""
            echo "Uploading to Google Drive..."

            if ! rclone copyto \
              "$output_file" \
              "$DEST_DIR/$relative_path" \
              --progress
            then

              echo "ERROR: Upload failed."
              failed=$((failed + 1))
              continue

            fi


            # ====================================================
            # 12. Verify uploaded file
            # ====================================================

            echo ""
            echo "Verifying uploaded file..."

            if rclone lsf \
              "$DEST_DIR/$relative_path" \
              --files-only \
              2>/dev/null | grep -q .
            then

              echo ""
              echo "=========================================="
              echo "SUCCESS"
              echo "$relative_path"
              echo "=========================================="

              # Remove local files only AFTER
              # successful upload verification.

              rm -f "$input_file"
              rm -f "$output_file"

            else

              echo ""
              echo "ERROR: Upload verification failed."

              failed=$((failed + 1))

            fi

          done < selected_videos.txt


          # ======================================================
          # Final summary
          # ======================================================

          echo ""
          echo "=========================================="
          echo "FINAL SUMMARY"
          echo "=========================================="

          echo "Processed:"
          echo "$processed"

          echo "Failed:"
          echo "$failed"

          echo "Maximum allowed:"
          echo "$MAX_VIDEOS"

          echo ""
          echo "Selected videos:"
          cat selected_videos.txt || true


      # ============================================================
      # 13. Final Google Drive check
      # ============================================================
      - name: Final verification
        shell: bash
        run: |

          echo "=========================================="
          echo "Checking NanNanIphone2"
          echo "=========================================="

          rclone lsf \
            "$DEST_DIR" \
            --files-only \
            --recursive \
            --format "p" \
            | sort -f \
            | tail -30 || true

          echo ""
          echo "Workflow completed."
